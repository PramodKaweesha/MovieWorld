<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player — Movie World</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link id="plyr-css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.css">
<style>
:root{
  --red:#e11d1d;
  --blue:#1a56ff;
  --bg:#05060a;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);font-family:'Segoe UI',Rajdhani,Arial,sans-serif;overflow:hidden;}
body{display:flex;flex-direction:column;color:#fff;}

/* ---- Top bar ---- */
.p-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#0a0d16;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;}
.p-title{font-size:14px;font-weight:700;letter-spacing:0.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
.p-top-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.p-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:7px;padding:7px 11px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s;}
.p-btn:hover{background:var(--blue);border-color:var(--blue);}
.p-btn.active{background:var(--red);border-color:var(--red);}
.p-btn.close-btn:hover{background:var(--red);border-color:var(--red);}

/* ---- Size modes for the stage ---- */
.p-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative;}
.p-frame{position:relative;background:#000;width:100%;height:100%;margin:auto;}
.p-stage.size-compact .p-frame{max-width:900px;max-height:100%;aspect-ratio:16/9;}
.p-stage.size-theater .p-frame{max-width:1400px;max-height:100%;aspect-ratio:16/9;}
.p-stage.size-full .p-frame{max-width:100%;max-height:100%;aspect-ratio:auto;}

.p-frame video, .p-frame .plyr{width:100%;height:100%;}
.p-frame .plyr{--plyr-color-main:var(--blue);--plyr-video-background:#000;--plyr-badge-background:var(--blue);
  --plyr-menu-background:rgba(10,14,26,0.97);--plyr-menu-color:#fff;--plyr-control-icon-size:18px;
  --plyr-control-spacing:10px;--plyr-tooltip-background:#111e35;--plyr-tooltip-color:#fff;
  --plyr-captions-font-size:20px;border-radius:0;}

/* ---- Loading / error ---- */
.p-msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;background:rgba(0,0,0,0.75);}
.p-msg.show{display:flex;}
.p-spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,0.15);border-top-color:var(--blue);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.p-msg p{font-size:13px;letter-spacing:1px;color:rgba(255,255,255,0.8);}
.p-retry{background:var(--red);border:none;color:#fff;padding:9px 20px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}

/* ---- Bottom feature bar ---- */
.p-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;background:#0a0d16;border-top:1px solid rgba(255,255,255,0.06);flex-shrink:0;}
.p-bottom .p-sep{width:1px;align-self:stretch;background:rgba(255,255,255,0.1);margin:0 2px;}
.p-time{font-size:12px;color:rgba(255,255,255,0.7);white-space:nowrap;}
.p-spacer{flex:1;}
select.p-select{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.12);border-radius:7px;padding:6px 8px;font-size:12px;}

@media(max-width:640px){
  .p-title{max-width:38vw;font-size:12px;}
  .p-btn{padding:6px 8px;font-size:11px;}
  .p-btn span.lbl{display:none;}
}
</style>
</head>
<body>

<div class="p-top">
  <div class="p-title" id="pTitle">MOVIE WORLD</div>
  <div class="p-top-actions">
    <select class="p-select" id="qualitySelect" onchange="switchQuality(this.value)" style="display:none;"></select>
    <button class="p-btn" id="sizeCompactBtn" onclick="setSize('compact')"><i class="fas fa-compress"></i><span class="lbl"> Compact</span></button>
    <button class="p-btn" id="sizeTheaterBtn" onclick="setSize('theater')"><i class="fas fa-tv"></i><span class="lbl"> Theater</span></button>
    <button class="p-btn" id="sizeFullBtn" onclick="setSize('full')"><i class="fas fa-expand"></i><span class="lbl"> Fill</span></button>
    <button class="p-btn" onclick="toggleFullscreen()"><i class="fas fa-expand-arrows-alt"></i><span class="lbl"> Fullscreen</span></button>
    <button class="p-btn close-btn" onclick="window.close()"><i class="fas fa-times"></i><span class="lbl"> Close</span></button>
  </div>
</div>

<div class="p-stage size-compact" id="pStage">
  <div class="p-frame" id="pFrame">
    <div class="p-msg show" id="pLoading"><div class="p-spin"></div><p>LOADING PLAYER...</p></div>
    <div class="p-msg" id="pError"><i class="fas fa-exclamation-circle" style="font-size:28px;color:var(--red);"></i><p>STREAM LOAD FAILED.</p><button class="p-retry" onclick="retry()"><i class="fas fa-redo"></i> RETRY</button></div>
  </div>
</div>

<div class="p-bottom">
  <button class="p-btn" onclick="skip(-10)" title="Back 10s"><i class="fas fa-undo"></i><span class="lbl"> 10s</span></button>
  <button class="p-btn" onclick="skip(10)" title="Forward 10s"><i class="fas fa-redo"></i><span class="lbl"> 10s</span></button>
  <span class="p-time" id="pTime">00:00 / 00:00</span>
  <div class="p-sep"></div>
  <select class="p-select" id="speedSelect" onchange="setSpeed(this.value)" title="Playback speed">
    <option value="0.5">0.5x</option>
    <option value="0.75">0.75x</option>
    <option value="1" selected>1x</option>
    <option value="1.25">1.25x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2x</option>
  </select>
  <button class="p-btn" id="subBtn" onclick="toggleSub()" style="display:none;"><i class="fas fa-closed-captioning"></i><span class="lbl"> Subtitle</span></button>
  <div class="p-spacer"></div>
  <a class="p-btn" id="dlBtn" href="#" download style="display:none;"><i class="fas fa-download"></i><span class="lbl"> Download</span></a>
  <button class="p-btn" id="reportBtn" onclick="reportBroken()"><i class="fas fa-flag"></i><span class="lbl"> Report</span></button>
</div>

<script>
/* ---------------- read params ---------------- */
const qp = new URLSearchParams(location.search);
const links = {};
['480','720','1080'].forEach(q=>{ const v = qp.get('q'+q); if(v) links[q]=v; });
const srtUrl = qp.get('srt') || '';
const title = qp.get('title') || 'MOVIE WORLD';
document.title = title + ' — Movie World';
document.getElementById('pTitle').textContent = title;

let activeQ = links['1080'] ? '1080' : links['720'] ? '720' : links['480'] ? '480' : null;
let plyrInstance = null, hlsInstance = null, videoEl = null, vttBlobUrl = null, subtitleOn = true;

/* quality dropdown */
const qSelect = document.getElementById('qualitySelect');
const qKeys = Object.keys(links);
if(qKeys.length > 1){
  qSelect.style.display = 'inline-block';
  qSelect.innerHTML = qKeys.map(q=>`<option value="${q}" ${q===activeQ?'selected':''}>${q}p</option>`).join('');
}

/* download button -> current quality link */
function updateDlBtn(){
  const dl = document.getElementById('dlBtn');
  if(activeQ && links[activeQ]){ dl.href = links[activeQ]; dl.style.display='inline-flex'; }
}

/* ---------------- size modes ---------------- */
function setSize(mode){
  const stage = document.getElementById('pStage');
  stage.classList.remove('size-compact','size-theater','size-full');
  stage.classList.add('size-'+mode);
  ['Compact','Theater','Full'].forEach(m=>document.getElementById('size'+m+'Btn').classList.toggle('active', m.toLowerCase()===mode));
  try{ localStorage.setItem('mw_player_size', mode); }catch(e){}
}
setSize(localStorage.getItem('mw_player_size') || 'compact');

function toggleFullscreen(){
  const frame = document.getElementById('pFrame');
  if(!document.fullscreenElement){ frame.requestFullscreen?.(); }
  else{ document.exitFullscreen?.(); }
}

/* ---------------- loading / error state ---------------- */
function showLoading(show){
  document.getElementById('pLoading').classList.toggle('show', show);
  if(show) document.getElementById('pError').classList.remove('show');
}
function showError(){
  document.getElementById('pLoading').classList.remove('show');
  document.getElementById('pError').classList.add('show');
}
function retry(){ if(activeQ) launch(links[activeQ]); }

/* ---------------- subtitle: SRT -> VTT ---------------- */
function srtToVtt(srtText){
  let vtt = srtText.replace(/\r/g,'').replace(/^\uFEFF/,'');
  vtt = vtt.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2');
  return 'WEBVTT\n\n' + vtt;
}
async function buildVtt(url){
  if(!url || !url.trim()) return null;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('fetch failed');
    const txt = await res.text();
    const blob = new Blob([srtToVtt(txt)], {type:'text/vtt'});
    return URL.createObjectURL(blob);
  }catch(e){ console.error('subtitle load failed', e); return null; }
}

/* ---------------- destroy / rebuild player ---------------- */
function destroyPlayer(){
  try{ if(hlsInstance){ hlsInstance.destroy(); hlsInstance=null; } }catch(e){}
  try{ if(plyrInstance){ plyrInstance.destroy(); plyrInstance=null; } }catch(e){}
  try{ if(vttBlobUrl){ URL.revokeObjectURL(vttBlobUrl); vttBlobUrl=null; } }catch(e){}
  document.getElementById('pFrame').querySelectorAll('video,.plyr').forEach(e=>e.remove());
}

let hasSubtitle = false;
function launch(url, resumeTime, autoResume){
  if(!url){ showError(); return; }
  showLoading(true);
  destroyPlayer();
  hasSubtitle = false;
  document.getElementById('subBtn').style.display='none';

  const boot = async ()=>{
    const frame = document.getElementById('pFrame');
    const vid = document.createElement('video');
    vid.setAttribute('playsinline','');
    vid.setAttribute('webkit-playsinline','');
    vid.crossOrigin = 'anonymous';
    vid.style.cssText = 'width:100%;height:100%;';
    videoEl = vid;

    if(srtUrl){
      const vtt = await buildVtt(srtUrl);
      if(vtt){
        vttBlobUrl = vtt;
        const track = document.createElement('track');
        track.kind='subtitles'; track.label='Sinhala'; track.srclang='si'; track.src=vtt; track.default=true;
        vid.appendChild(track);
        hasSubtitle = true;
        document.getElementById('subBtn').style.display='inline-flex';
        document.getElementById('subBtn').classList.add('active');
      }
    }
    frame.appendChild(vid);

    const isHls = /\.m3u8(\?|$)/i.test(url);
    const initPlyr = ()=>{
      try{
        plyrInstance = new Plyr(vid, {
          controls: ['play-large','play','progress','current-time','mute','volume','captions','pip','fullscreen'],
          autoplay: true,
          clickToPlay: true,
          captions: { active: hasSubtitle && subtitleOn, language:'si', update:true }
        });
        plyrInstance.on('ready', ()=>{ showLoading(false); syncTimeLoop(); restoreResume(url); });
        plyrInstance.on('playing', ()=>showLoading(false));
        plyrInstance.on('waiting', ()=>showLoading(true));
        plyrInstance.on('canplay', ()=>showLoading(false));
        plyrInstance.on('error', ()=>showError());
        if(resumeTime){
          vid.addEventListener('loadedmetadata', ()=>{
            try{ plyrInstance.currentTime = resumeTime; }catch(e){}
            if(autoResume){ try{ plyrInstance.play(); }catch(e){} }
          }, {once:true});
        }
        vid.addEventListener('timeupdate', ()=>saveResume(url));
        setTimeout(()=>{ if(document.getElementById('pLoading').classList.contains('show')) showLoading(false); }, 4500);
      }catch(e){ console.error(e); showError(); }
    };

    if(isHls){
      if(vid.canPlayType('application/vnd.apple.mpegurl')){ vid.src=url; initPlyr(); }
      else{
        loadHlsJs(()=>{
          try{
            hlsInstance = new Hls({maxBufferLength:30, enableWorker:true});
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(vid);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, initPlyr);
            hlsInstance.on(Hls.Events.ERROR, (evt,data)=>{ if(data && data.fatal) showError(); });
          }catch(e){ console.error(e); showError(); }
        });
      }
    }else{
      vid.src = url;
      initPlyr();
    }
  };

  if(window.Plyr){ boot(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.js';
  s.onload = boot; s.onerror = showError;
  document.head.appendChild(s);
}
function loadHlsJs(cb){
  if(window.Hls){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js';
  s.onload = cb; s.onerror = showError;
  document.head.appendChild(s);
}

/* ---------------- resume position ---------------- */
function resumeKey(url){ return 'mw_resume_'+url; }
function saveResume(url){
  if(!plyrInstance) return;
  try{ localStorage.setItem(resumeKey(url), Math.floor(plyrInstance.currentTime)); }catch(e){}
}
function restoreResume(url){
  try{
    const t = parseFloat(localStorage.getItem(resumeKey(url)));
    if(t > 5 && plyrInstance && plyrInstance.duration && t < plyrInstance.duration - 10){
      plyrInstance.currentTime = t;
    }
  }catch(e){}
}

/* ---------------- controls ---------------- */
function switchQuality(q){
  if(!links[q]) return;
  activeQ = q;
  const resumeTime = plyrInstance ? plyrInstance.currentTime : 0;
  const wasPlaying = plyrInstance ? !plyrInstance.paused : true;
  launch(links[q], resumeTime, wasPlaying);
  updateDlBtn();
}
function skip(sec){ if(plyrInstance) plyrInstance.currentTime = Math.max(0, plyrInstance.currentTime + sec); }
function setSpeed(v){ if(plyrInstance) plyrInstance.speed = parseFloat(v); }
function toggleSub(){
  subtitleOn = !subtitleOn;
  document.getElementById('subBtn').classList.toggle('active', subtitleOn);
  if(plyrInstance){ try{ plyrInstance.toggleCaptions(subtitleOn); }catch(e){} }
}
function fmtTime(t){ if(!isFinite(t)||t<0) t=0; const m=Math.floor(t/60), s=Math.floor(t%60); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
let timeRAF=null;
function syncTimeLoop(){
  if(timeRAF) cancelAnimationFrame(timeRAF);
  const tick=()=>{
    if(plyrInstance){ document.getElementById('pTime').textContent = fmtTime(plyrInstance.currentTime)+' / '+fmtTime(plyrInstance.duration||0); }
    timeRAF = requestAnimationFrame(tick);
  };
  tick();
}
function reportBroken(){
  const msg = encodeURIComponent('Broken stream link report — '+title+' ('+(activeQ||'')+'p): '+ (links[activeQ]||''));
  window.open('https://wa.me/?text='+msg, '_blank');
}

/* keyboard shortcuts */
document.addEventListener('keydown', e=>{
  if(!plyrInstance) return;
  if(e.key===' '){ e.preventDefault(); plyrInstance.togglePlay(); }
  else if(e.key==='ArrowRight'){ skip(10); }
  else if(e.key==='ArrowLeft'){ skip(-10); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); plyrInstance.volume = Math.min(1, plyrInstance.volume+0.1); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); plyrInstance.volume = Math.max(0, plyrInstance.volume-0.1); }
  else if(e.key==='f' || e.key==='F'){ toggleFullscreen(); }
  else if(e.key==='m' || e.key==='M'){ plyrInstance.muted = !plyrInstance.muted; }
});

/* ---------------- boot ---------------- */
if(!activeQ){
  showError();
  document.getElementById('pError').querySelector('p').textContent = 'STREAM LINK නැහැ!';
}else{
  updateDlBtn();
  launch(links[activeQ], 0, false);
}
</script>
</body>
</html>
